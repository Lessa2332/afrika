<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

  <style>
    :root {
      --bg: #12151a;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --gold-grad: linear-gradient(135deg,#bf953f 0%,#fcf6ba 25%,#b38728 50%,#fbf5b7 75%,#aa771c 100%);
      --glass: rgba(22,27,34,0.9);
      --border: rgba(212,175,55,0.3);
      --text: #f0f4f8;
      --muted: #94a3b8;
      --ok: #22c55e;
      --bad: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    html { height: 100%; height: -webkit-fill-available; }
    body {
      width: 100%; height: 100%; min-height: -webkit-fill-available;
      overflow: hidden; font-family: 'Inter', sans-serif;
      background: var(--bg); color: var(--text);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .glass { background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border); box-shadow: 0 8px 32px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05);
      border-radius: 16px; }
    .gold { background: var(--gold-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      font-family: 'Montserrat', sans-serif; font-weight: 700; }
    .overlay { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: rgba(10,12,16,0.9); backdrop-filter: blur(12px); }
    .card { width: 100%; max-width: 460px; padding: 24px 20px; text-align: center;
      display: flex; flex-direction: column; gap: 16px; }
    .sel, .btn { width: 100%; min-height: 50px; border-radius: 12px; font-size: 1rem; font-weight: 600; outline: none; }
    .sel { background: rgba(30,35,45,0.9); color: var(--text); border: 1px solid var(--border); padding: 0 16px; }
    .btn { background: var(--gold-grad); color: #0d0f12; border: none; cursor: pointer;
      font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(212,175,55,0.3); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    #app { display: flex; flex-direction: column; width: 100%; height: 100%; }
    header { height: 60px; padding: 8px 14px; margin: 8px 8px 0 8px;
      display: flex; align-items: center; justify-content: space-between; z-index: 1000; gap: 10px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--gold-grad); color: #12151a;
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.9rem; }
    .badge { padding: 5px 12px; border-radius: 20px; background: rgba(212,175,55,0.15);
      border: 1px solid var(--gold); color: var(--gold-light); font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
    #main { flex: 1; position: relative; min-height: 0; }
    #map { width: 100%; height: 100%; background: var(--bg); }
    #story-bar { position: absolute; bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      left: 10px; right: 10px; z-index: 1000; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
      max-height: 62vh; overflow-y: auto; }
    .narrative { font-size: 0.9rem; line-height: 1.45; color: var(--text); font-style: italic;
      border-left: 3px solid var(--gold); padding-left: 10px; }
    .question { font-size: 1rem; font-weight: 600; line-height: 1.35; text-align: center; }
    .choices { display: flex; flex-direction: column; gap: 8px; }
    .choice { min-height: 46px; padding: 10px 14px; background: rgba(30,35,45,0.85);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--text);
      font-weight: 600; font-size: 0.88rem; cursor: pointer; text-align: left;
      display: flex; align-items: center; gap: 10px; line-height: 1.3; }
    .choice .num { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;

      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }
    .choice.correct { background: rgba(34,197,94,0.25) !important; border-color: var(--ok) !important; color: #4ade80 !important; }
    .choice.incorrect { background: rgba(239,68,68,0.25) !important; border-color: var(--bad) !important; color: #f87171 !important; }
    .consequence { padding: 10px 12px; border-radius: 10px; background: rgba(212,175,55,0.1);
      border: 1px solid rgba(212,175,55,0.3); font-size: 0.85rem; line-height: 1.4; color: var(--gold-light); }

      border-radius: 50%; box-shadow: 0 0 12px rgba(212,175,55,0.8); }
    .stats { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 10px; font-size: 0.88rem; text-align: left; }
    .stats div { margin: 4px 0; }
  </style>
</head>

<!-- СТАРТ -->
<div id="scr-start" class="overlay">

    <h1 class="gold" style="font-size:1.3rem;">АФРИКА: ПОДОРОЖ</h1>

    </div>
    <div id="err" style="color:#f87171;font-size:0.82rem;display:none;"></div>
    <button id="btn-start" class="btn" disabled>Розпочати</button>
  </div>
</div>

<!-- ВЖЕ ПРОХОДИВ -->
<div id="scr-done" class="overlay" style="display:none;">
  <div class="card glass">
    <h1 class="gold" style="font-size:1.2rem;">ВИ ВЖЕ ПРОХОДИЛИ</h1>
    <p style="color:var(--muted);font-size:0.82rem;">Повторне проходження заборонено.</p>
    <div id="done-scores" class="stats"></div>
    <button onclick="location.reload()" class="btn">Ознайомитись</button>
  </div>
</div>

<!-- МІЖ ЕТАПАМИ -->
<div id="scr-inter" class="overlay" style="display:none;">
  <div class="card glass">
    <h1 id="inter-title" class="gold" style="font-size:1.2rem;">ЕТАП ЗАВЕРШЕНО</h1>
    <div id="inter-scores" class="stats"></div>
    <button id="btn-next" class="btn">Далі →</button>
  </div>
</div>

<!-- ФІНАЛ -->
<div id="scr-final" class="overlay" style="display:none;">
  <div class="card glass">
    <h1 class="gold" style="font-size:1.2rem;">ПОДОРОЖ ЗАВЕРШЕНА!</h1>
    <div style="margin:6px 0;">
      <div style="font-size:0.82rem;color:var(--muted);">Середня оцінка:</div>
      <div id="final-avg" style="font-size:2.8rem;font-weight:800;font-family:Montserrat;" class="gold">0.0</div>
      <div style="font-size:0.82rem;color:var(--gold-light);">з 12.0 балів</div>
    </div>
    <div id="final-stats" class="stats"></div>
    <div id="final-sync" style="font-size:0.78rem;color:var(--gold);"></div>
    <button onclick="location.reload()" class="btn">Завершити</button>
  </div>
</div>

<!-- ДОДАТОК -->
<div id="app" style="display:none;">
  <header class="glass">
    <div style="display:flex;align-items:center;gap:10px;">
      <div id="av" class="avatar">?</div>
      <div>
        <div id="uname" style="font-weight:700;font-size:0.88rem;">Учень</div>
        <div id="prog" style="font-size:0.68rem;color:var(--muted);">Етап 1 • 1/29</div>
      </div>
    </div>
    <div id="score" class="badge">0.0 / 12.0</div>
  </header>
  <div id="main">
    <div id="map"></div>
    <div id="story-bar" class="glass">
      <div id="narrative" class="narrative"></div>
      <div id="question" class="question gold"></div>
      <div id="choices" class="choices"></div>
      <div id="consequence" class="consequence" style="display:none;"></div>
    </div>
  </div>
</div>

// ============================================================
// СТАН
// ============================================================
let student = "";
let stage = 1;
let taskIdx = 0;
let stageScore = 0;
let stageFirst = 0;
let stageSecond = 0;
let attempts = 0;
let s1Score = null, s1First = null;
let s2Score = null, s2First = null;
let routeId = "";
let map = null;
let marker = null;

// ============================================================
// ІНІЦІАЛІЗАЦІЯ
// ============================================================
document.addEventListener("DOMContentLoaded", () => {
  loadStudents();
  document.getElementById("btn-start").addEventListener("click", onStart);
  document.getElementById("btn-next").addEventListener("click", onNext);
});

async function loadStudents() {
  const sel = document.getElementById("sel-student");
  try {
    const r = await fetch(API + "?action=list");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    fillSelect(d.students || d);
  } catch (e) {
    console.warn("Fallback list:", e);
    fillSelect([
      "Бохонок Олеся","Бондаренко Олексій","Василенко Данило",
      "Гриценко Марія","Дмитренко Артем","Іванова Софія",
      "Коваленко Максим","Мельник Анна","Шевченко Тарас","Яковенко Єва"
    ]);
  }
}

function fillSelect(list) {
  const sel = document.getElementById("sel-student");
  sel.innerHTML = '<option value="" disabled selected>Обери своє прізвище...</option>';
  list.sort().forEach(n => {
    const o = document.createElement("option");
    o.value = n; o.textContent = n;
    sel.appendChild(o);
  });
  sel.addEventListener("change", e => {
    student = e.target.value;
    document.getElementById("btn-start").disabled = !student;
  });
}

async function onStart() {
  if (!student) return;
  const btn = document.getElementById("btn-start");
  btn.disabled = true; btn.textContent = "Перевірка...";

  const key = "africa_done_" + student;
  const local = safeLS.get(key);
  if (local) { showDone(JSON.parse(local)); return; }

  try {
    const r = await fetch(API + "?action=check&student=" + encodeURIComponent(student));
    const d = await r.json();
    if (d.status === "already_passed") {
      safeLS.set(key, JSON.stringify([d.stage1, d.stage2]));
      showDone([d.stage1, d.stage2, d.route]); return;
    }
  } catch (e) { console.warn("Server check failed:", e); }

  startApp();
}

function showDone(scores) {
  document.getElementById("scr-start").style.display = "none";
  document.getElementById("scr-done").style.display = "flex";
  document.getElementById("done-scores").innerHTML = `
    <div><strong>Етап 1 (Номенклатура):</strong> ${scores[0] ?? "—"} / 12</div>
    <div><strong>Етап 2 (Подорож):</strong> ${scores[1] ?? "—"} / 12</div>
    ${scores[2] ? `<div><strong>Маршрут:</strong> ${scores[2]}</div>` : ""}
  `;
}

function startApp() {
  document.getElementById("scr-start").style.display = "none";
  document.getElementById("app").style.display = "flex";
  document.getElementById("uname").textContent = student;
  document.getElementById("av").textContent = student.charAt(0);
  // Визначаємо маршрут за хешем імені (стабільно для учня)
  routeId = ROUTES[hashCode(student) % ROUTES.length].id;
  startStage(1);
}

function hashCode(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) - h) + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

// ============================================================
// ЕТАПИ
// ============================================================
function startStage(s) {
  stage = s; taskIdx = 0;
  stageScore = 0; stageFirst = 0; stageSecond = 0; attempts = 0;
  if (!map) initMap();
  document.getElementById("story-bar").style.display = (s === 2) ? "flex" : "none";
  loadTask();
}

function initMap() {
  map = L.map("map", { zoomControl: false, attributionControl: false }).setView([2, 16], 3);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 6, minZoom: 3 }).addTo(map);
  L.control.zoom({ position: "topright" }).addTo(map);
}

function loadTask() {
  if (stage === 1) return loadStage1();
  return loadStage2();
}

// ---------- ЕТАП 1: НОМЕНКЛАТУРА ----------
function loadStage1() {
  if (taskIdx >= STAGE1.length) return finishStage();
  attempts = 0;
  const t = STAGE1[taskIdx];
  document.getElementById("prog").textContent = `Етап 1 • ${taskIdx + 1}/${STAGE1.length}`;
  document.getElementById("question").textContent = t.q;
  document.getElementById("narrative").textContent = `Категорія: ${t.cat}`;
  document.getElementById("consequence").style.display = "none";
  document.getElementById("story-bar").style.display = "none";

  // Прибираємо старі кнопки вибору (для етапу 1 вони не потрібні — об'єкт на карті)
  // Використовуємо той самий контейнер, але з питанням-картою
  const cont = document.getElementById("choices");
  cont.innerHTML = "";
  const shuffled = [...t.o].sort(() => 0.5 - Math.random());
  shuffled.forEach(o => {
    const b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = `<span class="num">?</span><span>${o}</span>`;
    b.addEventListener("click", () => onAnswer1(b, o === t.a));
    cont.appendChild(b);
  });

  if (marker) map.removeLayer(marker);
  const icon = L.divIcon({ className: "marker", iconSize: [22, 22], iconAnchor: [11, 11] });
  marker = L.marker(t.c, { icon }).addTo(map);
  map.flyTo(t.c, 4, { duration: 1 });
  updateScoreBadge(STAGE1.length);
}

function onAnswer1(btn, ok) {
  attempts++;
  if (ok) {
    btn.classList.add("correct");
    if (attempts === 1) { stageScore += 1; stageFirst++; }
    else if (attempts === 2) { stageScore += 0.5; stageSecond++; }
    updateScoreBadge(STAGE1.length);
    document.querySelectorAll(".choice").forEach(b => b.disabled = true);
    setTimeout(() => { taskIdx++; loadStage1(); }, 700);
  } else {
    btn.classList.add("incorrect"); btn.disabled = true;
  }
}

// ---------- ЕТАП 2: РОЛЬОВА ПОДОРОЖ ----------
function loadStage2() {
  const route = ROUTES.find(r => r.id === routeId) || ROUTES[0];
  if (taskIdx >= route.scenes.length) return finishStage();
  attempts = 0;
  const sc = route.scenes[taskIdx];

  document.getElementById("prog").textContent = `Етап 2 • ${route.emoji} ${route.title} • ${taskIdx + 1}/${route.scenes.length}`;
  document.getElementById("narrative").textContent = sc.n;
  document.getElementById("question").textContent = sc.q;
  document.getElementById("consequence").style.display = "none";
  document.getElementById("story-bar").style.display = "flex";

  const cont = document.getElementById("choices");
  cont.innerHTML = "";
  const letters = ["А","Б","В","Г","Д"];
  const shuffled = [...sc.o].sort(() => 0.5 - Math.random());
  shuffled.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = `<span class="num">${letters[i]}</span><span>${o.t}</span>`;
    b.addEventListener("click", () => onAnswer2(b, o, sc));
    cont.appendChild(b);
  });

  if (marker) map.removeLayer(marker);
  const icon = L.divIcon({ className: "marker", iconSize: [22, 22], iconAnchor: [11, 11] });
  marker = L.marker(sc.c, { icon }).addTo(map);
  map.flyTo(sc.c, 5, { duration: 1 });
  updateScoreBadge(route.scenes.length);
}

function onAnswer2(btn, opt, sc) {
  attempts++;
  if (opt.ok) {
    btn.classList.add("correct");
    if (attempts === 1) { stageScore += 1; stageFirst++; }
    else if (attempts === 2) { stageScore += 0.5; stageSecond++; }
    updateScoreBadge(ROUTES.find(r => r.id === routeId).scenes.length);

    const cons = document.getElementById("consequence");
    cons.textContent = "✓ " + opt.r;
    cons.style.display = "block";

    document.querySelectorAll(".choice").forEach(b => b.disabled = true);
    setTimeout(() => { taskIdx++; loadStage2(); }, 1600);
  } else {
    btn.classList.add("incorrect"); btn.disabled = true;
    const cons = document.getElementById("consequence");
    cons.textContent = "✗ " + opt.r;
    cons.style.display = "block";
  }
}

function updateScoreBadge(total) {
  const s = ((stageScore / total) * 12).toFixed(1);
  document.getElementById("score").textContent = `${s} / 12.0`;
}

// ============================================================
// ЗАВЕРШЕННЯ ЕТАПУ
// ============================================================
async function finishStage() {
  const total = stage === 1 ? STAGE1.length : ROUTES.find(r => r.id === routeId).scenes.length;
  const score12 = parseFloat(((stageScore / total) * 12).toFixed(1));

  const ok = await submit(stage, score12, stageFirst, routeId);

  document.getElementById("app").style.display = "none";

  if (stage === 1) {
    s1Score = score12; s1First = stageFirst;
    const div = document.getElementById("inter-scores");
    document.getElementById("inter-title").textContent = "ЕТАП 1 ЗАВЕРШЕНО";
    div.innerHTML = `
      <div><strong>Номенклатура:</strong> ${score12} / 12</div>
      <div>З першої спроби: ${stageFirst} (×1.0)</div>
      <div>З другої спроби: ${stageSecond} (×0.5)</div>
      <div style="margin-top:6px;color:${ok ? '#4ade80' : '#f87171'};">
        ${ok ? '✓ Збережено' : '⚠ Не збережено'}
      </div>
      <div style="margin-top:10px;font-size:0.82rem;color:var(--muted);">
        Далі на тебе чекає рольова подорож Африкою. Твій маршрут визначено за іменем.
      </div>
    `;
    document.getElementById("btn-next").textContent = "У подорож →";
    document.getElementById("scr-inter").style.display = "flex";
  } else {
    s2Score = score12;
    const route = ROUTES.find(r => r.id === routeId);
    const avg = ((s1Score + score12) / 2).toFixed(1);
    document.getElementById("final-avg").textContent = avg;
    document.getElementById("final-stats").innerHTML = `
      <div><strong>Етап 1 (Номенклатура):</strong> ${s1Score} / 12</div>
      <div><strong>Етап 2 (${route.emoji} ${route.title}):</strong> ${score12} / 12</div>
      <div><strong>Маршрут:</strong> ${route.title}</div>
    `;
    document.getElementById("final-sync").textContent = ok ? "✓ Усі результати збережено" : "⚠ Деякі результати не збережено";
    safeLS.set("africa_done_" + student, JSON.stringify([s1Score, score12, route.title]));
    document.getElementById("scr-final").style.display = "flex";
  }
}

function onNext() {
  document.getElementById("scr-inter").style.display = "none";
  document.getElementById("app").style.display = "flex";
  startStage(2);
}

// ============================================================
// ВІДПРАВКА НА СЕРВЕР
// ============================================================
async function submit(stageNum, score, firstTry, route) {
  try {
    const body = new URLSearchParams({
      student, stage: String(stageNum), score: String(score),
      firstTry: String(firstTry), route: route || ""
    });
    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString()
    });
    if (!r.ok) { console.error("HTTP", r.status); return false; }
    const d = await r.json();
    if (d.error) { console.error("Server:", d.error); return false; }
    return true;
  } catch (e) { console.error(e); return false; }
}
</script>
